<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myntra Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">Myntra Clone</div>
    <nav>
      <a href="#">Men</a>
      <a href="#">Women</a>
      <a href="#">Kids</a>
      <a href="#">Home & Living</a>
      <a href="#">Beauty</a>
    </nav>
    <input type="text" placeholder="Search for products..." class="search-bar">
  </header>

  <!-- Banner -->
  <section class="banner">
    <img src="https://images.unsplash.com/photo-1521335629791-ce4aec67dd47?w=1200" alt="Fashion Banner">
  </section>

  <!-- Categories -->
  <section class="categories">
    <h2>Categories</h2>
    <div class="category-grid">
      <div>
        <img src="https://images.unsplash.com/photo-1602810318383-e3b59a3c61a6?w=500" alt="Men">
        <p>Men</p>
      </div>
      <div>
        <img src="https://images.unsplash.com/photo-1618354691373-d851c6b6b0f6?w=500" alt="Women">
        <p>Women</p>
      </div>
      <div>
        <img src="https://images.unsplash.com/photo-1612336307429-2f8f1ec9c35f?w=500" alt="Kids">
        <p>Kids</p>
      </div>
      <div>
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a3d357b2?w=500" alt="Shoes">
        <p>Shoes</p>
      </div>
    </div>
  </section>

  <!-- Products -->
  <section class="products">
    <h2>Popular Products</h2>
    <div class="product-grid">
      <div class="product">
        <img src="https://images.unsplash.com/photo-1514995669114-b2dbec4d6c0e?w=400" alt="T-shirt">
        <h3>T-shirt</h3>
        <p>₹499</p>
      </div>
      <div class="product">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400" alt="Shoes">
        <h3>Sneakers</h3>
        <p>₹1,299</p>
      </div>
      <div class="product">
        <img src="https://images.unsplash.com/photo-1618354691373-d851c6b6b0f6?w=400" alt="Dress">
        <h3>Dress</h3>
        <p>₹1,999</p>
      </div>
      <div class="product">
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a3d357b2?w=400" alt="Backpack">
        <h3>Backpack</h3>
        <p>₹899</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 Myntra Clone | Made with ❤️</p>
  </footer>

</body>
</html>
